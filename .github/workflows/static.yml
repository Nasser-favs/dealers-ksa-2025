  const tbody = document.getElementById('tableBody');
  const searchInput = document.getElementById('searchInput');
  const countryFilter = document.getElementById('countryFilter');
  const offerFilter = document.getElementById('offerFilter');
  const stats = document.getElementById('stats');

  let currentSortKey = null;
  let currentSortDir = 'asc';

  function renderTable(){
    const q = searchInput.value.trim().toLowerCase();
    const c = countryFilter.value;
    const o = offerFilter.value;

    let filtered = dealers.filter(d=>{
      const text = (d.brand + ' ' + d.dealer + ' ' + d.city + ' ' + (d.country||'')).toLowerCase();
      if(q && !text.includes(q)) return false;
      if(c && d.country !== c) return false;
      if(o === 'yes' && !d.has_offers) return false;
      if(o === 'no' && d.has_offers) return false;
      return true;
    });

    if(currentSortKey){
      filtered.sort((a,b)=>{
        const av = (a[currentSortKey]||'').toString().toLowerCase();
        const bv = (b[currentSortKey]||'').toString().toLowerCase();
        if(av < bv) return currentSortDir==='asc' ? -1 : 1;
        if(av > bv) return currentSortDir==='asc' ? 1 : -1;
        return 0;
      });
    }

    tbody.innerHTML = '';
    filtered.forEach(d=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${d.brand}</td>
        <td>${d.country}</td>
        <td>${d.dealer}</td>
        <td><a href="${d.dealer_url}" target="_blank" rel="noopener">موقع الوكيل</a></td>
        <td>${d.city||'-'}</td>
        <td><a href="tel:${d.phone}">${d.phone}</a></td>
        <td>
          ${d.has_offers
            ? `<button class="badge-offer" onclick="openOffer('${encodeURIComponent(d.brand)}','${encodeURIComponent(d.dealer)}')">عرض</button>`
            : `<span class="no-offer">--</span>`
          }
        </td>
      `;
      tbody.appendChild(tr);
    });

    stats.textContent = `عدد السجلات المعروضة: ${filtered.length} من ${dealers.length}`;
  }

  // فرز الأعمدة
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click',()=>{
      const key = th.getAttribute('data-key');
      if(currentSortKey === key){
        currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
      }else{
        currentSortKey = key;
        currentSortDir = 'asc';
      }
      renderTable();
    });
  });

  searchInput.addEventListener('input',renderTable);
  countryFilter.addEventListener('change',renderTable);
  offerFilter.addEventListener('change',renderTable);

  // منطق النافذة المنبثقة للعروض
  const offerModalBackdrop = document.getElementById('offerModalBackdrop');
  const offerTitle = document.getElementById('offerTitle');
  const offerSummary = document.getElementById('offerSummary');
  const offerNotes = document.getElementById('offerNotes');
  const offerLink = document.getElementById('offerLink');
  const offerCloseBtn = document.getElementById('offerCloseBtn');

  window.openOffer = function(brandEnc,dealerEnc){
    const brand = decodeURIComponent(brandEnc);
    const dealer = decodeURIComponent(dealerEnc);
    const d = dealers.find(x=>x.brand===brand && x.dealer===dealer && x.has_offers);
    if(!d) return;
    offerTitle.textContent = `${d.brand} -- ${d.dealer}`;
    offerSummary.textContent = d.offer_summary || '';
    offerNotes.innerHTML = `هذه نبذة مختصرة عن العرض الحالي. التفاصيل النهائية (السعر، الدفعة الأولى، مدة التمويل، الشروط) يجب التأكد منها من صفحة العرض الرسمية أو من الوكيل مباشرة.`;
    offerLink.href = d.offer_link;
    offerModalBackdrop.style.display = 'flex';
  }

  function closeModal(){
    offerModalBackdrop.style.display = 'none';
  }

  offerCloseBtn.addEventListener('click',closeModal);
  offerModalBackdrop.addEventListener('click',e=>{
    if(e.target === offerModalBackdrop) closeModal();
  });
  document.addEventListener('keydown',e=>{
    if(e.key === 'Escape') closeModal();
  });

  renderTable();
</script>

</body>
</html>
on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
