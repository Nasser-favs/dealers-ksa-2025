  </style>
</head>
<body>

<div class="container">
  <h1>دليل وكلاء السيارات في السعودية 2025</h1>
  <div class="subtitle">
    قاعدة بيانات قابلة للبحث والفرز، مع إشارة إلى العروض الحالية وروابطها الرسمية.
  </div>

  <div class="filters">
    <label>
      بحث عام
      <input id="searchInput" type="text" placeholder="ابحث بالعلامة أو الوكيل أو المدينة...">
    </label>
    <label>
      الدولة
