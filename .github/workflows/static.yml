        <option>كوريا الجنوبية</option>
        <option>أمريكا</option>
        <option>ألمانيا</option>
        <option>بريطانيا</option>
        <option>فرنسا</option>
        <option>الصين</option>
      </select>
    </label>
    <label>
      وجود عروض
      <select id="offerFilter">
        <option value="">الكل</option>
        <option value="yes">يوجد عروض</option>
        <option value="no">لا يوجد</option>
      </select>
    </label>
  </div>

  <table id="dealersTable">
    <thead>
      <tr>
        <th class="sortable" data-key="brand">العلامة</th>
        <th class="sortable" data-key="country">الدولة</th>
        <th class="sortable" data-key="dealer">الوكيل</th>
        <th>موقع الوكيل</th>
        <th class="sortable" data-key="city">المدينة</th>
        <th>الهاتف</th>
        <th>العروض</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- يمتلئ ديناميكياً من JavaScript -->
    </tbody>
  </table>

  <div class="footer">
    <div id="stats"></div>
    <div>آخر تحديث تقريبي للعروض: ربع 4 - 2025 (تحقق دائمًا من تفاصيل العرض في موقع الوكيل مباشرة).</div>
  </div>
</div>

<!-- نافذة العروض -->
<div class="modal-backdrop" id="offerModalBackdrop">
  <div class="modal">
